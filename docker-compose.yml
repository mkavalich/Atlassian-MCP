# =============================================================================
# Atlassian MCP - Docker Compose
#
# Deploys all 8 MCP servers with optimizations (caching, schema registry,
# response formatting, telemetry).
#
# Usage:
#   docker-compose up -d                    # Start all servers
#   docker-compose up -d jira-projects      # Start specific server
#   docker-compose logs -f jira-projects    # View logs
#   docker-compose down                     # Stop all servers
#
# Environment:
#   Copy .env.example to .env and configure your Atlassian credentials
#
# Ports:
#   jira-projects ............ 4001
#   jira-workflows ........... 4002
#   jira-fields-permissions .. 4003
#   jira-service-desk ........ 4004
#   jira-organization ........ 4005
#   jira-system-admin ........ 4006
#   jira-product-discovery ... 4007
#   confluence ............... 4008
# =============================================================================

services:
  # Jira Projects MCP Server
  jira-projects:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVER: jira-projects
    container_name: jira-projects-mcp
    environment:
      - TRANSPORT=http
      - MCP_PORT=3000
      - SERVER_NAME=jira-projects
      - DEBUG=${DEBUG:-false}
      - DEBUG_CACHE=${DEBUG_CACHE:-false}
      - ATLASSIAN_SITE_URL=${ATLASSIAN_SITE_URL}
      - ATLASSIAN_USER_EMAIL=${ATLASSIAN_USER_EMAIL}
      - ATLASSIAN_API_TOKEN=${ATLASSIAN_API_TOKEN}
    ports:
      - "127.0.0.1:4001:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mcp-internal
      - mcp-egress
    mem_limit: 512m
    cpus: 0.5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

